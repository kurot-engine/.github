name: Feature request
description: Propose a focused capability or API improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the concrete game-development problem this would solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or API. Include a small usage example when possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or other designs you considered.

  - type: input
    id: packages
    attributes:
      label: Affected packages
      placeholder: "@kurot/core, @kurot/ui"

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note Egret behavior, browser/backend requirements, migration impact, or asset-format constraints.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for a similar proposal.
          required: true
        - label: This request describes a concrete use case, not only an implementation preference.
          required: true
